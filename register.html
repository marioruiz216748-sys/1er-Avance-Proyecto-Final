<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de usuario de Backoffice">
    <title>Registro | Backoffice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">B</div>
                <h1>Crear cuenta</h1>
            </div>
            <p class="subtitle">Completa tus datos para registrarte.</p>

            <form id="registerForm">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Crea una contraseña" minlength="6" required>

                <button type="submit">Crear cuenta</button>
            </form>

            <p class="switch-page">¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a></p>
            <p id="message" class="message" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
