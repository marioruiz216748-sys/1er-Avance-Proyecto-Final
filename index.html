<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión de Backoffice">
    <title>Login | Backoffice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">B</div>
                <h1>Backoffice</h1>
            </div>
            <p class="subtitle">Bienvenido de nuevo. Ingresa a tu cuenta.</p>

            <form id="loginForm">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>

                <button type="submit">Iniciar sesión</button>
            </form>

            <p class="switch-page">¿No tienes una cuenta? <a href="register.html">Regístrate</a></p>
            <p id="message" class="message" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
